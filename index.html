<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.webp" />
        <link rel="stylesheet" href="src/style.css" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Serene</title>
    </head>
    <body>
        <div class="parallax">
            <img id="grass2" src="src/assets/grass right 2.webp">
            <img id="grass1" src="src/assets/grass left 1.webp">
            <img id="cloud" src="src/assets/cloud 4.webp">
            <img id="bottombar" src="src/assets/bottombar.webp">
            <img id="ornament" src="src/assets/ornament 3.webp">
        </div>
        <div class="container">
            <h1 id="clock">12:00</h1>
            <h2 id="calender">9/9/2026 Wenesday</h2>
            <form id="search-form">
                <input
                    type="text"
                    id="search-input"
                    placeholder="Type what you want to search"
                    autocomplete="off"
                />
                <button id="search-btn" type="submit" ></button>
            </form>
        </div>
        <div class="weather-container">
            <div class="current-weather">
                <p id="weather-icon">☀️</p>
                <p id="temperature">27'C</p>
                <p id="condition">sunny</p>
                <p id="humidity">💧29%</p>
                <p id="rain">🌧️0.1mm</p>
            </div>
            <div id="weather-forecast"></div>
        </div>
        <div id="location-settings">
            <h1>Location</h1>
            <input
                id="latitude-input"
                type="number"
                step="any"
                placeholder="Latitude"
            >
            <input
                id="longitude-input"
                type="number"
                step="any"
                placeholder="Longitude"
            >
            <button id="location-save">Save</button>
            <button id="location-cancel">Cancel</button>
        </div>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
